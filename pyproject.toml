[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridstrokeseg"
version = "0.1.0"
description = "Clean-room reproduction of a handcrafted hybrid ischemic-stroke lesion segmentation pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "SimpleITK>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.7,<1",
]
notebook = [
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
